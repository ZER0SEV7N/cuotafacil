name: ci pipeline

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Verificar
        run: ./mvnw -B -ntp verify

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-failsafe-jacoco-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
