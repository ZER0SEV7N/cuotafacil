name: cicd pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Verificar
        run: ./mvnw -B -ntp verify

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cuotafacil-jar
          path: target/*.jar
          if-no-files-found: error

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: cuotafacil-jar
          path: target

      - name: Desplegar en dev
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh dev target/cuotafacil-*.jar

  deploy-cert:
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: cert
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: cuotafacil-jar
          path: target

      - name: Desplegar en cert
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh cert target/cuotafacil-*.jar
